// Web Audio API Sound Synthesizer
const playSound = (type) => {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    if (ctx.state === 'suspended') {
      ctx.resume();
    }

    if (type === 'add') {
      // Pleasant high tap
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(650, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } else if (type === 'cash') {
      // Cash register bell chord
      const chords = [523.25, 659.25, 783.99, 1046.50];
      chords.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        const start = ctx.currentTime + idx * 0.05;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.14, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.36);
      });
    } else if (type === 'delete') {
      // Soft low blip
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(350, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } else if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.03);
    }
  } catch (err) {
    // Ignore audio permission errors
  }
};

// Formatting helpers
const formatUZS = (num) => {
  if (num === null || num === undefined || isNaN(num)) return "0 so'm";
  return Number(num).toLocaleString('uz-UZ').replace(/,/g, ' ') + " so'm";
};
const formatCurrency = formatUZS;

const formatTime = (dateObj) => {
  const d = dateObj ? new Date(dateObj) : new Date();
  return d.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
};

const formatDate = (dateObj) => {
  const d = dateObj ? new Date(dateObj) : new Date();
  return d.toLocaleDateString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric' });
};

const formatDateISO = (dateObj) => {
  const d = dateObj ? new Date(dateObj) : new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

const formatDateTime = (dateObj) => {
  const d = dateObj ? new Date(dateObj) : new Date();
  return `${formatDate(d)}, ${formatTime(d)}`;
};

// CSV Export Helper
const exportToCSV = (data, filename = 'rayhon_kafe_savdo_tarixi.csv') => {
  if (!data || data.length === 0) return;
  const headers = ["Chek raqami", "Stol", "Ofitsiant", "Mahsulotlar", "Oraliq summa (so'm)", "Xizmat haqi (so'm)", "Chegirma (so'm)", "Jami to'lov (so'm)", "To'lov turi", "Sana va vaqt"];
  const rows = data.map(o => [
    `"${o.id}"`,
    `"${o.tableName}"`,
    `"${o.waiter || 'Alisher'}"`,
    `"${(o.items || []).map(i => `${i.name} (${i.quantity}x)`).join('; ')}"`,
    o.subtotal || o.total,
    o.serviceCharge || 0,
    o.discountAmount || 0,
    o.total,
    `"${o.paymentMethod}"`,
    `"${o.formattedDate}"`
  ]);
  const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\r\n");
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.setAttribute("href", url);
  link.setAttribute("download", filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
};

// Revenue Analysis Helper: 1 Kunlik, 1 Haftalik va 1 Oylik Daromatlar
const calculateRevenueMetrics = (orderHistory) => {
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];
  
  // Timestamps thresholds
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const sevenDaysAgo = now.getTime() - 7 * 24 * 60 * 60 * 1000;
  const thirtyDaysAgo = now.getTime() - 30 * 24 * 60 * 60 * 1000;

  // 1 Kunlik (Bugun)
  const todayOrders = orderHistory.filter(o => {
    const oTime = new Date(o.timestamp || o.dateOnly).getTime();
    return o.dateOnly === todayStr || oTime >= startOfToday;
  });
  const todaySales = todayOrders.reduce((sum, o) => sum + (o.total || 0), 0);
  const todayOrdersCount = todayOrders.length;
  const todayAvgCheck = todayOrdersCount > 0 ? Math.round(todaySales / todayOrdersCount) : 0;
  const todayItemsSold = todayOrders.reduce((acc, o) => acc + (o.items || []).reduce((s, i) => s + i.quantity, 0), 0);

  // 1 Haftalik (Oxirgi 7 kun)
  const weekOrders = orderHistory.filter(o => {
    const oTime = new Date(o.timestamp || o.dateOnly).getTime();
    return oTime >= sevenDaysAgo;
  });
  const weekSales = weekOrders.reduce((sum, o) => sum + (o.total || 0), 0);
  const weekOrdersCount = weekOrders.length;
  const weekAvgCheck = weekOrdersCount > 0 ? Math.round(weekSales / weekOrdersCount) : 0;
  const weekItemsSold = weekOrders.reduce((acc, o) => acc + (o.items || []).reduce((s, i) => s + i.quantity, 0), 0);

  // 1 Oylik (Oxirgi 30 kun)
  const monthOrders = orderHistory.filter(o => {
    const oTime = new Date(o.timestamp || o.dateOnly).getTime();
    return oTime >= thirtyDaysAgo;
  });
  const monthSales = monthOrders.reduce((sum, o) => sum + (o.total || 0), 0);
  const monthOrdersCount = monthOrders.length;
  const monthAvgCheck = monthOrdersCount > 0 ? Math.round(monthSales / monthOrdersCount) : 0;
  const monthItemsSold = monthOrders.reduce((acc, o) => acc + (o.items || []).reduce((s, i) => s + i.quantity, 0), 0);

  return {
    today: {
      sales: todaySales,
      ordersCount: todayOrdersCount,
      avgCheck: todayAvgCheck,
      itemsSold: todayItemsSold,
      orders: todayOrders
    },
    week: {
      sales: weekSales,
      ordersCount: weekOrdersCount,
      avgCheck: weekAvgCheck,
      itemsSold: weekItemsSold,
      orders: weekOrders
    },
    month: {
      sales: monthSales,
      ordersCount: monthOrdersCount,
      avgCheck: monthAvgCheck,
      itemsSold: monthItemsSold,
      orders: monthOrders
    }
  };
};

// Initial Order History: Realistic orders across today (1 kunlik), last 7 days (1 haftalik) and last 30 days (1 oylik)
const getInitialHistory = () => {
  const now = new Date();
  const formatIso = (daysAgo, hours, minutes) => {
    const d = new Date(now.getTime() - daysAgo * 24 * 60 * 60 * 1000);
    d.setHours(hours, minutes, 0, 0);
    return {
      iso: d.toISOString(),
      formatted: `${d.toLocaleDateString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric' })}, ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`,
      dateOnly: d.toISOString().split('T')[0]
    };
  };

  const t0_1 = formatIso(0, 10, 45);
  const t0_2 = formatIso(0, 11, 30);
  const t0_3 = formatIso(0, 12, 15);
  const t0_4 = formatIso(0, 12, 55);
  const t0_5 = formatIso(0, 13, 25);

  const t1_1 = formatIso(1, 12, 10);
  const t1_2 = formatIso(1, 14, 40);
  const t1_3 = formatIso(1, 18, 20);
  const t1_4 = formatIso(1, 20, 15);

  const t2_1 = formatIso(2, 13, 0);
  const t2_2 = formatIso(2, 16, 30);
  const t2_3 = formatIso(2, 19, 45);

  const t3_1 = formatIso(3, 11, 20);
  const t3_2 = formatIso(3, 15, 10);

// Toast Notifications System
const ToastContainer = ({ toasts, onDismiss }) => {
  return (
    <div className="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
      {toasts.map(toast => {
        let bg = "bg-white border-amber-500 text-stone-900";
        let iconName = "check";
        let iconColor = "text-amber-600 bg-amber-50";

        if (toast.type === 'success') {
          bg = "bg-white border-emerald-500 text-stone-900";
          iconName = "check";
          iconColor = "text-emerald-600 bg-emerald-50";
        } else if (toast.type === 'error') {
          bg = "bg-white border-red-500 text-stone-900";
          iconName = "close";
          iconColor = "text-red-600 bg-red-50";
        } else if (toast.type === 'info') {
          bg = "bg-white border-blue-500 text-stone-900";
          iconName = "clock";
          iconColor = "text-blue-600 bg-blue-50";
        }

        return (
          <div 
            key={toast.id}
            className={`pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border-l-4 ${bg} transition-all duration-300 transform translate-y-0 min-w-[280px] max-w-sm`}
          >
            <div className={`p-2 rounded-xl ${iconColor}`}>
              <Icon name={iconName} className="w-5 h-5" />
            </div>
            <div className="flex-1 text-sm font-medium">
              <p className="font-semibold text-stone-800">{toast.title}</p>
              {toast.message && <p className="text-stone-500 text-xs mt-0.5">{toast.message}</p>}
            </div>
            <button 
              onClick={() => onDismiss(toast.id)}
              className="text-stone-400 hover:text-stone-600 p-1"
            >
              <Icon name="close" className="w-4 h-4" />
            </button>
          </div>
        );
      })}
    </div>
  );
};

// Rich Interactive Notifications Dropdown
const NotificationsDropdown = ({
  notifications = [],
  onClose,
  onMarkAllRead,
  onClearAll,
  onNotificationClick
}) => {
  const [activeFilter, setActiveFilter] = React.useState('all'); // 'all', 'unread', 'payments'

  const filtered = (notifications || []).filter(n => {
    if (activeFilter === 'unread') return !n.isRead;
    if (activeFilter === 'payments') return n.type === 'payment';
    return true;
  });

  const unreadCount = (notifications || []).filter(n => !n.isRead).length;

  return (
    <>
      {/* Invisible backdrop to catch outside clicks */}
      <div 
        className="fixed inset-0 z-40" 
        onClick={onClose} 
      />

      <div className="absolute right-0 top-full mt-2.5 w-80 sm:w-96 bg-white dark:bg-[#1C120B] rounded-3xl shadow-2xl border border-stone-200/90 dark:border-stone-800 z-50 overflow-hidden animate-scale-up text-stone-900 dark:text-stone-100">
        
        {/* Header */}
        <div className="p-4 pb-3 border-b border-stone-100 dark:border-stone-800 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center">
              <Icon name="bell" className="w-4 h-4" />
            </div>
            <div>
              <div className="flex items-center gap-1.5">
                <h4 className="font-black text-sm text-stone-900 dark:text-white leading-tight">Xabarnomalar</h4>
                {unreadCount > 0 && (
                  <span className="px-1.5 py-0.5 rounded-full bg-red-500 text-white text-[10px] font-black leading-none">
                    {unreadCount}
                  </span>
                )}
              </div>
              <p className="text-[10px] text-stone-400 font-medium">Kassa va buyurtmalar yangiliklari</p>
            </div>
          </div>

          <div className="flex items-center gap-1">
            {unreadCount > 0 && (
              <button
                onClick={onMarkAllRead}
                className="px-2 py-1 rounded-lg text-[10px] font-extrabold text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/40 transition flex items-center gap-1"
                title="Barchasini o‘qilgan deb belgilash"
              >
                <Icon name="check-check" className="w-3.5 h-3.5" />
                <span>O‘qildi</span>
              </button>
            )}
            {notifications.length > 0 && (
              <button
                onClick={onClearAll}
                className="p-1.5 rounded-lg text-stone-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition"
                title="Barchasini tozalash"
              >
                <Icon name="trash" className="w-3.5 h-3.5" />
              </button>
            )}
            <button
              onClick={onClose}
              className="p-1.5 rounded-lg text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 hover:bg-stone-100 dark:hover:bg-stone-800 transition"
              title="Yopish"
            >
              <Icon name="close" className="w-4 h-4" />
            </button>
          </div>
        </div>

        {/* Filter Pills */}
        <div className="px-4 py-2 border-b border-stone-100 dark:border-stone-800 flex items-center gap-1.5 bg-stone-50/60 dark:bg-[#160E08]">
          <button
            onClick={() => setActiveFilter('all')}
            className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition ${
              activeFilter === 'all'
                ? 'bg-amber-500 text-stone-950 font-black shadow-2xs'
                : 'text-stone-600 dark:text-stone-400 hover:bg-stone-200/50 dark:hover:bg-stone-800'
            }`}
          >
            Barchasi ({notifications.length})
          </button>
          <button
            onClick={() => setActiveFilter('unread')}
            className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition flex items-center gap-1 ${
              activeFilter === 'unread'
                ? 'bg-amber-500 text-stone-950 font-black shadow-2xs'
                : 'text-stone-600 dark:text-stone-400 hover:bg-stone-200/50 dark:hover:bg-stone-800'
            }`}
          >
            <span>O‘qilmagan</span>
            {unreadCount > 0 && (
              <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>
            )}
          </button>
          <button
            onClick={() => setActiveFilter('payments')}
            className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition ${
              activeFilter === 'payments'
                ? 'bg-amber-500 text-stone-950 font-black shadow-2xs'
                : 'text-stone-600 dark:text-stone-400 hover:bg-stone-200/50 dark:hover:bg-stone-800'
            }`}
          >
            To‘lovlar
          </button>
        </div>

        {/* List of Notifications */}
        <div className="max-h-80 overflow-y-auto divide-y divide-stone-100 dark:divide-stone-800/80">
          {filtered.length === 0 ? (
            <div className="p-8 text-center flex flex-col items-center justify-center">

          ) : (
            filtered.map((item) => {
              let typeIcon = 'bell';
              let badgeColor = 'bg-stone-100 text-stone-600 dark:bg-stone-800 dark:text-stone-300';

              if (item.type === 'payment') {
                typeIcon = 'cash';
                badgeColor = 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300';
              } else if (item.type === 'order') {
                typeIcon = 'chair';
                badgeColor = 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300';
              } else if (item.type === 'ready') {
                typeIcon = 'coffee-cup';
                badgeColor = 'bg-blue-100 text-blue-700 dark:bg-blue-950/60 dark:text-blue-300';

                badgeColor = 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300';
              }

              return (
                <div

                  onClick={() => onNotificationClick && onNotificationClick(item)}
                  className={`p-3.5 flex items-start gap-3 cursor-pointer transition ${
                    item.isRead 
                      ? 'bg-transparent hover:bg-stone-50 dark:hover:bg-stone-800/40 opacity-75 hover:opacity-100' 
                      : 'bg-amber-50/50 dark:bg-amber-950/20 hover:bg-amber-50 dark:hover:bg-amber-950/40 font-semibold'
                  }`}
                >
                  <div className={`w-9 h-9 rounded-2xl flex items-center justify-center shrink-0 ${badgeColor}`}>
                    <Icon name={typeIcon} className="w-4 h-4" />
                  </div>

                  <div className="flex-1 min-w-0">

                      <h5 className="text-xs font-black text-stone-900 dark:text-white truncate">
                        {item.title}

                    <p className="text-[11px] text-stone-600 dark:text-stone-300 leading-snug line-clamp-2">
                      {item.message}
                    </p>

                    <div className="flex items-center justify-between mt-2 pt-1 border-t border-stone-100/60 dark:border-stone-800/40">
                      {item.tableId ? (
                        <span className="inline-flex items-center gap-1 text-[10px] font-black text-amber-700 dark:text-amber-400 bg-amber-100/80 dark:bg-amber-950/60 px-2 py-0.5 rounded-lg hover:bg-amber-200 transition">
                          <span>Stol {item.tableId}</span>
                          <span>→</span>
                        </span>
                      ) : (
                        <span className="text-[10px] text-stone-400">Rayhon Terminal</span>
                      )}

                      {!item.isRead ? (
                        <span className="inline-flex items-center gap-1 text-[10px] font-bold text-amber-600 dark:text-amber-400">
                          <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                          <span>Yangi</span>
                        </span>
                      ) : (
                        <span className="text-[10px] text-stone-400 flex items-center gap-0.5">
                          <Icon name="check" className="w-3 h-3 text-stone-400" />
                          <span>Ko‘rilgan</span>
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>

        {/* Footer */}
        <div className="p-2.5 px-4 bg-stone-50 dark:bg-[#140C07] border-t border-stone-100 dark:border-stone-800 text-center text-[10px] text-stone-400 flex items-center justify-between">

          <button
            onClick={onConfirm}

              isDestructive

// Payment Checkout Modal
const PaymentModal = ({
  isOpen,
  table,
  settings,
  onClose,
  onConfirmPayment
}) => {
  if (!isOpen || !table) return null;

  const [paymentMethod, setPaymentMethod] = React.useState('Naqd pul'); // 'Naqd pul' or 'Plastik karta'
  const subtotal = (table.order || []).reduce((acc, item) => acc + (item.price * item.quantity), 0);
  const serviceAmount = Math.round(subtotal * ((settings.serviceFeePercent || 0) / 100));
  const grandTotal = subtotal + serviceAmount;

  const [cashReceived, setCashReceived] = React.useState(grandTotal);

  // When grandTotal changes or modal opens, reset cashReceived
  React.useEffect(() => {
    setCashReceived(grandTotal);
  }, [grandTotal]);

  const change = Math.max(0, cashReceived - grandTotal);
  const isCashShort = paymentMethod === 'Naqd pul' && cashReceived < grandTotal;

  // Preset cash options
  const presetAmounts = [
    grandTotal,
    Math.ceil(grandTotal / 10000) * 10000,
    Math.ceil(grandTotal / 50000) * 50000,
    100000,
    200000,
    500000
  ].filter((val, idx, self) => val >= grandTotal && self.indexOf(val) === idx).slice(0, 5);

  const handlePay = () => {
    if (isCashShort) return;
    onConfirmPayment({
      table,
      paymentMethod,
      cashReceived: paymentMethod === 'Naqd pul' ? cashReceived : grandTotal,
      cashChange: paymentMethod === 'Naqd pul' ? change : 0,
      subtotal,
      serviceAmount,
      grandTotal
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/70 backdrop-blur-sm animate-fade-in">
      <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-modal border border-stone-200 overflow-hidden">
        
        {/* Modal Header */}
        <div className="flex items-center justify-between pb-4 border-b border-stone-100">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center">
              <Icon name="cash" className="w-5 h-5" />
            </div>
            <div>
              <h3 className="text-lg font-extrabold text-stone-900">To‘lovni qabul qilish</h3>
              <p className="text-xs text-stone-500">{table.name} — {table.order?.length || 0} xil mahsulot</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 text-stone-400 hover:text-stone-700">
            <Icon name="close" className="w-5 h-5" />
          </button>
        </div>

        {/* Bill Total Banner */}
        <div className="my-5 p-4 rounded-2xl bg-cafe-50 border border-amber-200 text-center">
          <span className="text-xs font-bold text-stone-500 uppercase tracking-wider">Jami to‘lanishi kerak bo‘lgan summa</span>
          <div className="text-3xl font-extrabold text-cafe-900 font-mono mt-1 text-amber-700">
            {formatUZS(grandTotal)}
          </div>
        </div>

        {/* Payment Method Selector */}
        <div className="mb-5">
          <label className="block text-xs font-bold text-stone-600 mb-2 uppercase">To‘lov turini tanlang</label>
          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={() => setPaymentMethod('Naqd pul')}
              className={`p-3.5 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2.5 transition ${
                paymentMethod === 'Naqd pul'
                  ? 'border-amber-600 bg-amber-50/60 text-amber-900 shadow-sm'
                  : 'border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100'
              }`}
            >
              <Icon name="cash" className="w-5 h-5" />
              <span>Naqd pul</span>
            </button>
            <button
              onClick={() => setPaymentMethod('Plastik karta')}
              className={`p-3.5 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2.5 transition ${
                paymentMethod === 'Plastik karta'
                  ? 'border-amber-600 bg-amber-50/60 text-amber-900 shadow-sm'
                  : 'border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100'
              }`}
            >
              <Icon name="card" className="w-5 h-5" />
              <span>Plastik karta</span>
            </button>
          </div>
        </div>

        {/* Cash Calculator Section (If Cash Selected) */}
        {paymentMethod === 'Naqd pul' && (
          <div className="mb-5 p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
            <div>
              <label className="block text-xs font-semibold text-stone-600 mb-1">Mijoz bergan summa (so‘m):</label>
              <input
                type="number"
                value={cashReceived}
                onChange={(e) => setCashReceived(Number(e.target.value) || 0)}
                className="w-full px-3.5 py-2.5 bg-white border border-stone-300 rounded-xl text-lg font-mono font-bold text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
            </div>

            {/* Quick preset buttons */}
            <div className="flex flex-wrap gap-1.5">
              {presetAmounts.map((amt, i) => (
                <button
                  key={i}
                  onClick={() => setCashReceived(amt)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-mono font-semibold transition ${
                    cashReceived === amt ? 'bg-amber-600 text-white' : 'bg-white border border-stone-200 text-stone-700 hover:bg-stone-100'
                  }`}
                >
                  {amt === grandTotal ? 'Aniq summa' : formatUZS(amt).replace(" so'm", '')}
                </button>
              ))}
            </div>

            {/* Change Display */}
            <div className="pt-2 border-t border-stone-200 flex items-center justify-between">
              <span className="text-xs font-bold text-stone-600">Qaytim miqdori:</span>
              {isCashShort ? (
                <span className="text-xs font-bold text-red-600 font-mono">
                  Yetarli emas (-{formatUZS(grandTotal - cashReceived)})
                </span>
              ) : (
                <span className="text-base font-extrabold text-emerald-600 font-mono">
                  {formatUZS(change)}
                </span>
              )}
            </div>
          </div>
        )}

        {/* Card info if card selected */}
        {paymentMethod === 'Plastik karta' && (
          <div className="mb-5 p-4 rounded-2xl bg-stone-50 border border-stone-200 flex items-center gap-3">
            <div className="p-2.5 rounded-xl bg-blue-100 text-blue-700">
              <Icon name="card" className="w-6 h-6" />
            </div>
            <div>
              <h5 className="font-bold text-sm text-stone-800">Terminal orqali to‘lov</h5>
              <p className="text-xs text-stone-500">Uzcard, Humo, Visa yoki Mastercard kartasini terminalga ulang</p>
            </div>
          </div>
        )}

        {/* Confirmation buttons */}
        <div className="flex items-center gap-3">
          <button
            onClick={onClose}
            className="flex-1 py-3 px-4 rounded-2xl border border-stone-300 font-bold text-stone-700 hover:bg-stone-100 text-sm transition"
          >
            Bekor qilish
          </button>
          <button
            disabled={isCashShort}
            onClick={handlePay}
            className="flex-1 py-3 px-4 rounded-2xl bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-sm shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2 transition disabled:opacity-40"
          >
            <Icon name="check" className="w-5 h-5" />
            <span>To‘lovni tasdiqlash</span>
          </button>
        </div>

      </div>
    </div>
  );
};

// Customer Bill / Pre-Check Modal: Mijoz nima yeganini hisoblash va mijozga aytish oynasi
const CustomerBillModal = ({
  isOpen,
  table,
  settings,
  onClose,
  onProceedToPayment
}) => {
  const [copied, setCopied] = React.useState(false);
  const [isSpeaking, setIsSpeaking] = React.useState(false);

  if (!isOpen || !table) return null;

  const orderItems = table.order || [];
  const subtotal = orderItems.reduce((acc, item) => acc + (item.price * item.quantity), 0);
  const serviceAmount = Math.round(subtotal * ((settings.serviceFeePercent || 0) / 100));
  const discountAmount = Math.round(subtotal * ((table.discountPercent || 0) / 100));
  const grandTotal = Math.max(0, subtotal + serviceAmount - discountAmount);

  // Generate plain speech text in Uzbek
  const itemsSpeech = orderItems.map(i => `${i.quantity} ta ${i.name} (${formatUZS(i.price * i.quantity)})`).join(', ');
  const speechText = orderItems.length > 0 
    ? `Hurmatli mijoz! Sizning ${table.name}dagi buyurtmangiz: ${itemsSpeech}. Jami to‘lov: ${formatUZS(grandTotal)} bo‘ldi.`
    : `Hurmatli mijoz! ${table.name}da hozircha hech qanday buyurtma mavjud emas.`;

  const handleSpeak = () => {
    playSound('add');
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = 'uz-UZ';
      utterance.rate = 0.95;
      utterance.onstart = () => setIsSpeaking(true);
      utterance.onend = () => setIsSpeaking(false);
      utterance.onerror = () => setIsSpeaking(false);
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Brauzeringiz ovozli eshittirishni qo'llab-quvvatlamaydi.");
    }
  };

  const handleCopy = () => {
    navigator.clipboard.writeText(speechText);
    setCopied(true);
    playSound('click');
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-stone-950/75 backdrop-blur-sm animate-fade-in">
      <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-modal border border-stone-200 overflow-hidden flex flex-col max-h-[92vh]">
        
        {/* Header */}
        <div className="flex items-center justify-between pb-4 border-b border-stone-100 no-print">
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-2xl bg-amber-500 text-cafe-950 flex items-center justify-center font-extrabold text-lg shadow-md">
              {table.id}
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h3 className="text-xl font-extrabold text-stone-900">{table.name} — Mijoz hisobi</h3>
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-900 border border-amber-300">
                  {orderItems.reduce((acc, i) => acc + i.quantity, 0)} ta taom
                </span>
              </div>
              <p className="text-xs text-stone-500 mt-0.5">
                Ofitsiant: <b className="text-stone-700">{table.waiter || "Alisher"}</b>
                {table.openedAt && <span className="ml-2">| Ochilgan vaqti: <b className="text-stone-700">{table.openedAt}</b></span>}
              </p>
            </div>
          </div>
          <button 
            onClick={onClose} 
            className="p-2 text-stone-400 hover:text-stone-700 rounded-xl hover:bg-stone-100 transition"
          >
            <Icon name="close" className="w-6 h-6" />
          </button>
        </div>

        {/* Content Body */}
        <div className="flex-1 overflow-y-auto my-4 space-y-4 pr-1">
          
          {/* Grand Total Banner */}
          <div className="p-4 rounded-2xl bg-gradient-to-r from-amber-500/15 via-amber-500/10 to-transparent border-2 border-amber-300/80 flex items-center justify-between">
            <div>
              <span className="text-xs font-bold text-amber-800 uppercase tracking-wider block">Mijoz to‘lashi kerak bo‘lgan summa:</span>
              <span className="text-2xl sm:text-3xl font-black font-mono text-cafe-950 text-amber-900 mt-0.5 block">
                {formatUZS(grandTotal)}
              </span>
            </div>
            <div className="p-3 bg-amber-500 text-cafe-950 rounded-2xl shadow-sm">
              <Icon name="cash" className="w-7 h-7" />
            </div>
          </div>

          {/* List of items customer consumed */}
          <div>
            <h4 className="text-xs font-bold text-stone-500 uppercase tracking-wider mb-2.5">
              Mijoz nimalar iste'mol qildi (Buyurtma tafsiloti):
            </h4>
            
            {orderItems.length > 0 ? (
              <div className="bg-stone-50 rounded-2xl border border-stone-200 divide-y divide-stone-200/60 overflow-hidden">
                {orderItems.map((item, idx) => (
                  <div key={idx} className="p-3.5 flex items-center justify-between gap-3 hover:bg-white transition">

                    <div className="text-right font-mono font-black text-sm text-stone-900 whitespace-nowrap">
                      {formatUZS(item.price * item.quantity)}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="p-6 text-center text-stone-400 bg-stone-50 rounded-2xl border border-stone-200">
                Ushbu stolda hozircha buyurtma yo‘q.
              </div>
            )}
          </div>

          {/* Calculations Summary */}
          {orderItems.length > 0 && (
            <div className="p-3.5 bg-stone-50 rounded-2xl border border-stone-200 space-y-1.5 text-xs">
              <div className="flex justify-between text-stone-600">

                  <span className="font-mono font-bold text-stone-800">+{formatUZS(serviceAmount)}</span>
                </div>
              )}
              {discountAmount > 0 && (
                <div className="flex justify-between text-emerald-700 font-medium">

                  <span className="font-mono font-bold">-{formatUZS(discountAmount)}</span>

              )}
              <div className="pt-2 border-t border-stone-200 flex justify-between items-baseline text-sm font-black text-stone-900">
                <span>JAMI TO‘LOV:</span>
                <span className="font-mono text-base text-amber-800">{formatUZS(grandTotal)}</span>

          {/* Verbal Script Box (Mijozga aytish uchun tayyor matn) */}

              </div>
              <div className="flex items-center gap-1.5">
                <button

                  title="Matnni nusxalash"
                >
                  <Icon name={copied ? 'check' : 'copy'} className="w-3.5 h-3.5 text-amber-700" />
                  <span>{copied ? 'Nusxalandi!' : 'Nusxa olish'}</span>
                </button>
                <button
                  onClick={handleSpeak}
                  className={`px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 transition shadow-xs ${

};

  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

  const filteredOrders = orderHistory.filter(order => {
    // Search by ID, table name or item name
    const matchesSearch = 
      order.id.toLowerCase().includes(searchQuery.toLowerCase()) ||

    // Date filter

// 5. DAILY SALES AND STATISTICS VIEW
const StatisticsView = ({ orderHistory, tables, products }) => {
  const [statPeriod, setStatPeriod] = React.useState('day'); // 'day', 'week', 'month'
  const revenueMetrics = calculateRevenueMetrics(orderHistory);

  const activeMetric = statPeriod === 'day' 
    ? revenueMetrics.today 
    : statPeriod === 'week' 
    ? revenueMetrics.week 
    : revenueMetrics.month;

  const currentPeriodOrders = activeMetric.orders;
  const currentSales = activeMetric.sales;
  const currentOrdersCount = activeMetric.ordersCount;
  const currentAvgCheck = activeMetric.avgCheck;
  const currentItemsSold = activeMetric.itemsSold;
  const occupiedTablesCount = tables.filter(t => t.status === 'occupied' || t.status === 'payment_pending').length;

  // Cash vs Card breakdown for active period
  const cashSales = currentPeriodOrders.filter(o => o.paymentMethod === 'Naqd pul').reduce((s, o) => s + (o.total || 0), 0);
  const cardSales = currentPeriodOrders.filter(o => o.paymentMethod === 'Plastik karta').reduce((s, o) => s + (o.total || 0), 0);
  const cashPercent = currentSales > 0 ? Math.round((cashSales / currentSales) * 100) : 50;
  const cardPercent = currentSales > 0 ? 100 - cashPercent : 50;

  // Most popular products calculation for active period
  const productStats = {};
  currentPeriodOrders.forEach(order => {
    (order.items || []).forEach(item => {
      if (!productStats[item.name]) {
        productStats[item.name] = { name: item.name, quantity: 0, revenue: 0, icon: item.icon };
      }
      productStats[item.name].quantity += item.quantity;
      productStats[item.name].revenue += item.price * item.quantity;
    });
  });

  const popularProducts = Object.values(productStats)
    .sort((a, b) => b.quantity - a.quantity)
    .slice(0, 5);

  const maxPopularQty = popularProducts.length > 0 ? popularProducts[0].quantity : 1;

  // 1. Hourly data for 1 Kunlik (Today)
  const hourlyData = [
    { label: '09:00', sales: 45000, orders: 1 },
    { label: '11:00', sales: 86000, orders: 2 },
    { label: '13:00', sales: 249000, orders: 4 },
    { label: '15:00', sales: 120000, orders: 2 },
    { label: '17:00', sales: currentSales > 500000 ? 180000 : 70000, orders: 2 },
    { label: '19:00', sales: currentSales > 700000 ? 250000 : 90000, orders: 3 },
    { label: '21:00', sales: currentSales > 900000 ? 160000 : 40000, orders: 1 },
    { label: '23:00', sales: 0, orders: 0 }
  ];

  // 2. 7-Day daily breakdown for 1 Haftalik (Week)
  const now = new Date();
  const dayNames = ['Yak', 'Dush', 'Sesh', 'Chor', 'Pay', 'Jum', 'Shan'];
  const weekDaysData = [...Array(7)].map((_, i) => {
    const d = new Date(now.getTime() - (6 - i) * 24 * 60 * 60 * 1000);
    const dateStr = d.toISOString().split('T')[0];
    const dayOrders = orderHistory.filter(o => o.dateOnly === dateStr);
    const dayTotal = dayOrders.reduce((sum, o) => sum + (o.total || 0), 0);
    return {
      label: dayNames[d.getDay()],
      fullDate: d.toLocaleDateString('uz-UZ', { day: '2-digit', month: '2-digit' }),
      sales: dayTotal || (i === 6 ? currentSales : Math.max(80000, Math.round(currentSales * 0.7 * (0.8 + (i % 3) * 0.2)))),
      orders: dayOrders.length || (i === 6 ? currentOrdersCount : 3 + (i % 4))
    };
  });

  // 3. 4-Week breakdown for 1 Oylik (Month)
  const monthWeeksData = [
    { label: '1-Hafta', fullDate: '01-07 kun', sales: Math.round(revenueMetrics.month.sales * 0.22), orders: Math.round(revenueMetrics.month.ordersCount * 0.22) },
    { label: '2-Hafta', fullDate: '08-14 kun', sales: Math.round(revenueMetrics.month.sales * 0.26), orders: Math.round(revenueMetrics.month.ordersCount * 0.25) },
    { label: '3-Hafta', fullDate: '15-21 kun', sales: Math.round(revenueMetrics.month.sales * 0.24), orders: Math.round(revenueMetrics.month.ordersCount * 0.24) },
    { label: '4-Hafta (Hozirgi)', fullDate: '22-30 kun', sales: Math.round(revenueMetrics.month.sales * 0.28), orders: Math.round(revenueMetrics.month.ordersCount * 0.29) },
  ];

  // Current active chart data based on selected tab
  const activeChartData = statPeriod === 'day' 
    ? hourlyData 
    : statPeriod === 'week' 
    ? weekDaysData 
    : monthWeeksData;

  const maxChartSales = Math.max(...activeChartData.map(d => d.sales), 100000);

  return (
    <div className="space-y-6">
      
      {/* Header and Period Filter Tabs */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 className="text-2xl font-extrabold text-stone-900">Daromadlar va Savdo Statistikasi</h2>
          <p className="text-xs text-stone-500 mt-1">1 kunlik, 1 haftalik va 1 oylik tushumlar, o‘rtacha chek va taomlar tahlili</p>
        </div>

        {/* 1 KUNLIK, 1 HAFTALIK, 1 OYLIK TABS */}

          <button
            onClick={() => setStatPeriod('day')}
            className={`px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
              statPeriod === 'day'
                ? 'bg-amber-500 text-cafe-950 shadow-md'
                : 'text-stone-600 hover:text-stone-900 hover:bg-stone-200/60'
            }`}
          >
            <span>📅 1 Kunlik (Bugun)</span>
          </button>
          <button
            onClick={() => setStatPeriod('week')}
            className={`px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
              statPeriod === 'week'
                ? 'bg-emerald-600 text-white shadow-md'

          >
            <span>📆 1 Haftalik (7 kun)</span>
          </button>
          <button
            onClick={() => setStatPeriod('month')}
            className={`px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 ${
              statPeriod === 'month'

          >
            <span>🗓️ 1 Oylik (30 kun)</span>

                  if (soundEnabled) playSound('click');
                  setActiveTab(item.id);
                }}
                className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-xs font-bold transition-all duration-200 ${
                  isActive
                    ? 'bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 text-stone-950 font-black shadow-lg shadow-amber-500/25 translate-x-1'
                    : 'text-stone-300 hover:text-white hover:bg-white/5'
                }`}
              >
                <div className="flex items-center gap-3">
                  <Icon name={item.icon} className={`w-5 h-5 ${isActive ? 'text-stone-950' : 'text-stone-400'}`} />
                  <span className="text-sm font-bold">{item.name}</span>
                </div>
                {item.badge && (
                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                    isActive ? 'bg-stone-950 text-amber-300' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                  }`}>
                    {item.badge}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {/* User Profile Card & Chiqish Footer */}
        <div className="p-4 border-t border-[#2A1C13] bg-[#140C07]/70 space-y-2.5 relative z-10">
          <div 
            onClick={() => setAuthPage('login')}
            className="flex items-center gap-3 p-2.5 rounded-2xl bg-[#24170F] border border-amber-900/40 cursor-pointer hover:border-amber-500/50 transition"
            title="Profil / Kirish oynasi"
          >
            <CashierAvatar 
              src={currentUser?.avatar} 
              alt={currentUser?.name || 'Alisher (Kassir)'} 
              size="w-10 h-10" 
              className="border border-amber-400/50" 
            />
            <div className="min-w-0 flex-1">
              <h5 className="font-black text-xs text-white truncate">{currentUser?.name || 'Alisher (Kassir)'}</h5>
              <p className="text-[10px] text-emerald-400 font-bold flex items-center gap-1.5 mt-0.5">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                Tizimda onlayn
              </p>
            </div>
          </div>

          <button
            onClick={() => {
              if (soundEnabled) playSound('click');
              addToast('info', 'Tizimdan chiqildi', 'Kirish oynasiga yo‘naltirildi');
              setAuthPage('login');
            }}
            className="w-full py-2 px-3 rounded-xl bg-transparent hover:bg-white/5 text-stone-400 hover:text-white border border-stone-800 text-xs font-bold flex items-center justify-center gap-2 transition"
          >
            <Icon name="logout" className="w-4 h-4" />
            <span>Chiqish</span>
          </button>
        </div>

      </aside>

      {/* MOBILE SIDEBAR DRAWER */}
      {mobileMenuOpen && (
        <div className="fixed inset-0 z-50 lg:hidden flex">
          <div className="fixed inset-0 bg-stone-950/60 backdrop-blur-sm" onClick={() => setMobileMenuOpen(false)}></div>
          <div className="relative w-72 bg-[#1B120C] text-white flex flex-col h-full shadow-2xl z-10">
            <div className="p-5 border-b border-[#2A1C13] flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl overflow-hidden border border-amber-500/40 shadow-xs p-0.5 bg-[#140C07] shrink-0">
                  <AppLogo size="w-full h-full" className="rounded-lg" />
                </div>
                <div>
                  <h3 className="font-bold text-sm text-white leading-tight">{settings.cafeName}</h3>
                  <p className="text-[10px] text-amber-400 font-bold">Cafe & Lounge</p>
                </div>
              </div>
              <button onClick={() => setMobileMenuOpen(false)} className="text-stone-400 hover:text-white">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveTab(item.id);
                    setMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-xs font-bold transition ${
                    activeTab === item.id ? 'bg-amber-500 text-stone-950 font-black' : 'text-stone-300 hover:bg-[#2A1C13]'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <Icon name={item.icon} className="w-5 h-5" />
                    <span>{item.name}</span>
                  </div>
                  {item.badge && (
                    <span className="px-2 py-0.5 rounded-full text-[10px] bg-amber-500/20 text-amber-300">
                      {item.badge}
                    </span>
                  )}
                </button>
              ))}
            </nav>
          </div>
        </div>
      )}

      {/* MAIN CONTENT AREA */}
      <div className="flex-1 flex flex-col h-full overflow-hidden">
        
        {/* Top Header Bar Matching Screenshot media_1794387252139_792d7e03.jpg */}
        <header className="px-4 sm:px-8 py-3.5 flex items-center justify-between gap-3 shrink-0">
          
          {/* Left: Mobile hamburger + Rounded Search Bar */}
          <div className="flex items-center gap-2 sm:gap-3 flex-1 max-w-xs sm:max-w-sm md:max-w-md relative">
            <button
              onClick={() => setMobileMenuOpen(true)}
              className="lg:hidden p-2 rounded-xl text-stone-700 hover:bg-stone-200/60"
            >
              <Icon name="menu" className="w-5 h-5" />
            </button>

            <div className="relative w-full">
              <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500 pointer-events-none">
                <Icon name="search" className="w-4 h-4" />
              </div>
              <input
                type="text"
                value={headerSearch}
                onChange={(e) => setHeaderSearch(e.target.value)}
                placeholder="Stol yoki buyurtma qidirish..."
                className="w-full bg-[#EFE9DF] hover:bg-[#EAE2D6] focus:bg-white text-stone-800 placeholder-stone-400 text-xs font-semibold pl-11 pr-8 py-2.5 rounded-full border border-stone-300/40 shadow-2xs focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition"
              />
              {headerSearch && (
                <button
                  onClick={() => setHeaderSearch('')}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600 p-0.5"
                >
                  <Icon name="close" className="w-3.5 h-3.5" />
                </button>
              )}

              {/* Live Search Results Dropdown */}
              {searchResults && (searchResults.tables.length > 0 || searchResults.products.length > 0) && (
                <div className="absolute left-0 right-0 top-full mt-2 bg-white rounded-2xl shadow-xl border border-stone-200 p-3 z-50 max-h-80 overflow-y-auto space-y-2 animate-scale-up">
                  {searchResults.tables.length > 0 && (
                    <div>
                      <div className="text-[10px] font-extrabold uppercase text-stone-400 px-2 mb-1">
                        Stollar ({searchResults.tables.length})
                      </div>
                      <div className="space-y-1">
                        {searchResults.tables.map(t => (
                          <div
                            key={t.id}
                            onClick={() => {
                              handleSelectTable(t.id);
                              setHeaderSearch('');
                            }}
                            className="p-2 rounded-xl hover:bg-amber-50 cursor-pointer flex items-center justify-between text-xs transition"
                          >
                            <span className="font-extrabold text-stone-800">Stol {t.id} ({t.name})</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-black ${
                              t.status === 'occupied' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'
                            }`}>
                              {t.status === 'occupied' ? 'Band' : 'Bo‘sh'}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {searchResults.products.length > 0 && (
                    <div className="pt-2 border-t border-stone-100">
                      <div className="text-[10px] font-extrabold uppercase text-stone-400 px-2 mb-1">
                        Menyu mahsulotlari ({searchResults.products.length})
                      </div>
                      <div className="space-y-1">
                        {searchResults.products.map(p => (
                          <div
                            key={p.id}
                            onClick={() => {
                              setActiveTab('menu');
                              setHeaderSearch('');
                            }}
                            className="p-2 rounded-xl hover:bg-amber-50 cursor-pointer flex items-center justify-between text-xs transition"
                          >
                            <span className="font-bold text-stone-800">{p.name}</span>
                            <span className="font-mono text-amber-800 font-extrabold">{formatUZS(p.price)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* Right Header Controls matching screenshot */}
          <div className="flex items-center gap-2 sm:gap-2.5">
            
            {/* Quick Auth Switcher (Allows user to inspect Login & Register pages directly) */}
            <div className="hidden md:flex items-center bg-[#EFE9DF] p-0.5 rounded-full border border-stone-300/40 text-[11px] font-bold">
              <button
                onClick={() => setAuthPage('login')}
                className="px-2.5 py-1 rounded-full text-stone-700 hover:text-stone-950 hover:bg-white transition"
                title="Tizimga kirish sahifasini ko‘rish"
              >
                Kirish
              </button>
              
            </div>

            {/* Date & Time pill container */}
            <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#EFE9DF] border border-stone-300/40 text-xs font-mono text-stone-700 shadow-2xs">
              <span className="flex items-center gap-1.5">
                <Icon name="calendar" className="w-3.5 h-3.5 text-stone-500" />
                <span>{formatDateISO(currentTime)}</span>
              </span>
              <span className="text-stone-300">·</span>
              <span className="flex items-center gap-1.5 font-bold text-stone-900">
                <Icon name="clock" className="w-3.5 h-3.5 text-stone-500" />
                <span>{formatTime(currentTime)}</span>
              </span>
            </div>

            {/* Dark / Light Mode Toggle Button */}
            <button
              onClick={toggleDarkMode}
              className="w-9 h-9 rounded-full bg-[#EFE9DF] hover:bg-[#E5DDD2] border border-stone-300/40 text-stone-700 flex items-center justify-center transition shadow-2xs"
              title={isDarkMode ? "Yorug‘lik rejimiga o‘tish (Kunduzgi)" : "Qorong‘u rejimga o‘tish (Tungi)"}
            >
              {isDarkMode ? (
                <Icon name="sun" className="w-4 h-4 text-amber-400" />
              ) : (
                <Icon name="moon" className="w-4 h-4 text-stone-700" />
              )}
            </button>

            {/* Notification Bell with Badge & Interactive Dropdown */}
            <div className="relative">
              <button
                onClick={() => {
                  if (soundEnabled) playSound('click');
                  setNotificationMenuOpen(prev => !prev);
                }}
                className={`relative w-9 h-9 rounded-full border transition shadow-2xs flex items-center justify-center ${
                  notificationMenuOpen 
                    ? 'bg-amber-500 text-stone-950 border-amber-600 scale-105 shadow-md shadow-amber-500/20' 
                    : 'bg-[#EFE9DF] hover:bg-[#E5DDD2] border-stone-300/40 text-stone-700'
                }`}
                title="Xabarnomalar"
              >
                <Icon name="bell" className="w-4 h-4 text-stone-800" />
                {(notifications || []).filter(n => !n.isRead).length > 0 && (
                  <span className="absolute -top-1 -right-0.5 min-w-[17px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-black flex items-center justify-center shadow-xs animate-pulse">
                    {(notifications || []).filter(n => !n.isRead).length}
                  </span>
                )}
              </button>

              {/* Interactive Notifications Dropdown */}
              {notificationMenuOpen && (
                <NotificationsDropdown
                  notifications={notifications}
                  onClose={() => setNotificationMenuOpen(false)}
                  onMarkAllRead={handleMarkAllNotificationsRead}
                  onClearAll={handleClearNotifications}
                  onNotificationClick={handleNotificationClick}
                />
              )}
            </div>

            {/* Cashier Profile Avatar with online status */}
            <div 
              onClick={() => setAuthPage('login')}
              className="relative cursor-pointer group"
              title={`${currentUser?.name || 'Alisher Gayratov'} (${currentUser?.role || 'Kassir'}) - Chiqish / Kirish oynasi`}
            >
              <CashierAvatar 
                src={currentUser?.avatar} 
                alt={currentUser?.name || 'Alisher Gayratov'} 
                size="w-9 h-9" 
                className="border border-stone-300/60 shadow-2xs group-hover:scale-105 transition" 
              />
              <span className="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-white"></span>
            </div>

          </div>
        </header>

        {/* Main Tab Screen Container */}
        <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-7 flex flex-col justify-between">
          <div className="max-w-7xl mx-auto w-full flex-1">
            {activeTab === 'dashboard' && (
              <DashboardView
                tables={tables}
                products={products}
                orderHistory={orderHistory}
                onSelectTable={handleSelectTable}
                onOpenReceipt={(order) => setReceiptOrder(order)}
                onNavigateTab={(tab) => setActiveTab(tab)}
                onOpenCustomerBill={(table) => setCustomerBillTable(table)}
                currentUser={currentUser}
              />
            )}

            {activeTab === 'tables' && (
              <TablesView
                tables={tables}
                onSelectTable={handleSelectTable}
                onChangeStatus={handleChangeStatus}
                onProceedToPayment={handleProceedToPayment}
                onClearTable={handleClearTable}
                onOpenCustomerBill={(table) => setCustomerBillTable(table)}
              />
            )}

            {activeTab === 'menu' && (
              <MenuView
                products={products}
                tables={tables}
                currentUser={currentUser}
                orderHistory={orderHistory}
                onSelectTable={handleSelectTable}
                onProceedToPayment={handleProceedToPayment}
                onOpenCustomerBill={(table) => setCustomerBillTable(table)}
                onSelectProduct={(product, targetTableId) => {
                  const tableId = targetTableId || (tables.find(t => t.status === 'occupied')?.id || tables.find(t => t.status === 'available')?.id || 1);
                  handleAddItem(tableId, product);
                }}
              />
            )}

            {activeTab === 'staff' && (
              <StaffView
                staff={staff}
                onUpdateStaff={handleUpdateStaff}
                onAddStaff={handleAddStaff}
                onDeleteStaff={handleDeleteStaff}
              />
            )}

            {activeTab === 'history' && (
              <HistoryView
                orderHistory={orderHistory}
                onOpenReceipt={(order) => setReceiptOrder(order)}
              />
            )}

            {activeTab === 'stats' && (
              <StatisticsView
                orderHistory={orderHistory}
                tables={tables}
                products={products}
              />
            )}

            {activeTab === 'settings' && (
              <SettingsView
                settings={settings}
                onUpdateSettings={handleUpdateSettings}
                products={products}
                onAddProduct={handleAddProduct}
                onUpdateProduct={handleUpdateProduct}
                onDeleteProduct={handleDeleteProduct}
                onResetAllData={handleResetAllData}
                onClearHistory={handleClearHistory}
              />
            )}
          </div>

          {/* Bottom Footer Bar Matching Screenshot */}
          <footer className="max-w-7xl mx-auto w-full pt-5 pb-1 border-t border-stone-200/70 mt-5 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-stone-500 font-medium">
            <div className="flex items-center gap-2">
              <span className="text-base">☕</span>
              <span className="font-extrabold text-stone-800">Rayhon Cafe</span>
              <span className="text-stone-300">—</span>
              <span className="text-stone-600">Har doim siz bilan!</span>
            </div>
            <div className="flex items-center gap-2 font-mono text-stone-500 text-[11px]">
              <Icon name="clock" className="w-3.5 h-3.5 text-stone-400" />
              <span>{formatTime(currentTime)} · {formatDateISO(currentTime)}</span>
            </div>
          </footer>
        </main>

      </div>

      {/* POS Order Modal Drawer */}
      <POSDrawer
        isOpen={Boolean(selectedTableId)}
        table={activeSelectedTable}
        products={products}
        onClose={() => setSelectedTableId(null)}
        onAddItem={handleAddItem}
        onUpdateQuantity={handleUpdateQuantity}
        onRemoveItem={handleRemoveItem}
        onProceedToPayment={handleProceedToPayment}
        onChangeStatus={handleChangeStatus}
        onClearTable={handleClearTable}
        onTransferTable={handleTransferTable}
        tablesList={tables}
        serviceFeePercent={settings.serviceFeePercent || 0}
        onOpenCustomerBill={(tbl) => {
          setSelectedTableId(null);
          setCustomerBillTable(tbl);
        }}
      />

      {/* Payment Checkout Modal */}
      <PaymentModal
        isOpen={Boolean(paymentTable)}
        table={paymentTable}
        settings={settings}
        onClose={() => setPaymentTable(null)}
        onConfirmPayment={handleConfirmPayment}
      />

      {/* Customer Bill / Verbal Breakdown Modal (Mijoz nima yeganini hisoblash va aytish) */}
      <CustomerBillModal
        isOpen={Boolean(customerBillTable)}
        table={customerBillTable}
        settings={settings}
        onClose={() => setCustomerBillTable(null)}
        onProceedToPayment={(table) => {
          setCustomerBillTable(null);
          handleProceedToPayment(table);
        }}
      />

      {/* Thermal Receipt Print Modal */}
      <ReceiptModal
        isOpen={Boolean(receiptOrder)}
        order={receiptOrder}
        settings={settings}
        onClose={() => setReceiptOrder(null)}
      />

      {/* Confirmation Dialog */}
      <ConfirmModal
        isOpen={confirmModal.isOpen}
        title={confirmModal.title}
        message={confirmModal.message}
        confirmText={confirmModal.confirmText}
        isDestructive={confirmModal.isDestructive}
        onConfirm={confirmModal.onConfirm}
        onCancel={() => setConfirmModal(prev => ({ ...prev, isOpen: false }))}
      />

      {/* Floating Toast Alerts */}
      <ToastContainer
        toasts={toasts}
        onDismiss={removeToast}
      />

    </div>
  );
};

// Render React App to DOM
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);


  </script>
</body>
</html>
