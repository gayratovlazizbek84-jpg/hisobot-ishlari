// Web Audio API Sound Synthesizer
const playSound = (type) => {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    if (ctx.state === 'suspended') {
      ctx.resume();
    }

    if (type === 'add') {
      // Pleasant high tap
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(650, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } else if (type === 'cash') {
      // Cash register bell chord
      const chords = [523.25, 659.25, 783.99, 1046.50];
      chords.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        const start = ctx.currentTime + idx * 0.05;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.14, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.36);
      });
    } else if (type === 'delete') {
      // Soft low blip
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(350, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } else if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.03);
    }
  } catch (err) {
    // Ignore audio permission errors
  }
};

// Formatting helpers
const formatUZS = (num) => {
  if (num === null || num === undefined || isNaN(num)) return "0 so'm";
  return Number(num).toLocaleString('uz-UZ').replace(/,/g, ' ') + " so'm";
};

const formatTime = (dateObj) => {
  const d = dateObj ? new Date(dateObj) : new Date();
  return d.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
};

const formatDate = (dateObj) => {
  const d = dateObj ? new Date(dateObj) : new Date();
  return d.toLocaleDateString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric' });
};

const formatDateTime = (dateObj) => {
  const d = dateObj ? new Date(dateObj) : new Date();
  return `${formatDate(d)}, ${formatTime(d)}`;
};

// CSV Export Helper
const exportToCSV = (data, filename = 'rayhon_kafe_savdo_tarixi.csv') => {
  if (!data || data.length === 0) return;
  const headers = ["Chek raqami", "Stol", "Ofitsiant", "Mahsulotlar", "Oraliq summa (so'm)", "Xizmat haqi (so'm)", "Chegirma (so'm)", "Jami to'lov (so'm)", "To'lov turi", "Sana va vaqt"];
  const rows = data.map(o => [
    `"${o.id}"`,
    `"${o.tableName}"`,
    `"${o.waiter || 'Alisher'}"`,
    `"${(o.items || []).map(i => `${i.name} (${i.quantity}x)`).join('; ')}"`,
    o.subtotal || o.total,
    o.serviceCharge || 0,
    o.discountAmount || 0,
    o.total,
    `"${o.paymentMethod}"`,
    `"${o.formattedDate}"`
  ]);
  const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\r\n");
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.setAttribute("href", url);
  link.setAttribute("download", filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
};

// Toast Notifications System
const ToastContainer = ({ toasts, onDismiss }) => {
  return (
    <div className="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
      {toasts.map(toast => {
        let bg = "bg-white border-amber-500 text-stone-900";
        let iconName = "check";
        let iconColor = "text-amber-600 bg-amber-50";

        if (toast.type === 'success') {
          bg = "bg-white border-emerald-500 text-stone-900";
          iconName = "check";
          iconColor = "text-emerald-600 bg-emerald-50";
        } else if (toast.type === 'error') {
          bg = "bg-white border-red-500 text-stone-900";
          iconName = "close";
          iconColor = "text-red-600 bg-red-50";
        } else if (toast.type === 'info') {
          bg = "bg-white border-blue-500 text-stone-900";
          iconName = "clock";
          iconColor = "text-blue-600 bg-blue-50";
        }

        return (
          <div 
            key={toast.id}
            className={`pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border-l-4 ${bg} transition-all duration-300 transform translate-y-0 min-w-[280px] max-w-sm`}
          >
            <div className={`p-2 rounded-xl ${iconColor}`}>
              <Icon name={iconName} className="w-5 h-5" />
            </div>
            <div className="flex-1 text-sm font-medium">
              <p className="font-semibold text-stone-800">{toast.title}</p>
              {toast.message && <p className="text-stone-500 text-xs mt-0.5">{toast.message}</p>}
            </div>
            <button 
              onClick={() => onDismiss(toast.id)}
              className="text-stone-400 hover:text-stone-600 p-1"
            >
              <Icon name="close" className="w-4 h-4" />
            </button>
          </div>
        );
      })}
    </div>
  );
};

          <div className={`p-3 rounded-2xl ${isDestructive ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-700'}`}>

        <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-800 border border-amber-300">
          <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse-dot"></span>
          Band
        </span>
      );
    case 'payment_pending':
      return (
        <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200">

          To‘lov kutilmoqda
        </span>

    default:

};

// Payment Checkout Modal
const PaymentModal = ({
  isOpen,
  table,
  settings,
  onClose,
  onConfirmPayment
}) => {
  if (!isOpen || !table) return null;

  const [paymentMethod, setPaymentMethod] = React.useState('Naqd pul'); // 'Naqd pul' or 'Plastik karta'
  const subtotal = (table.order || []).reduce((acc, item) => acc + (item.price * item.quantity), 0);
  const serviceAmount = Math.round(subtotal * ((settings.serviceFeePercent || 0) / 100));
  const grandTotal = subtotal + serviceAmount;

  const [cashReceived, setCashReceived] = React.useState(grandTotal);

  // When grandTotal changes or modal opens, reset cashReceived
  React.useEffect(() => {
    setCashReceived(grandTotal);
  }, [grandTotal]);

  const change = Math.max(0, cashReceived - grandTotal);
  const isCashShort = paymentMethod === 'Naqd pul' && cashReceived < grandTotal;

  // Preset cash options
  const presetAmounts = [
    grandTotal,
    Math.ceil(grandTotal / 10000) * 10000,
    Math.ceil(grandTotal / 50000) * 50000,
    100000,
    200000,
    500000
  ].filter((val, idx, self) => val >= grandTotal && self.indexOf(val) === idx).slice(0, 5);

  const handlePay = () => {
    if (isCashShort) return;
    onConfirmPayment({
      table,
      paymentMethod,
      cashReceived: paymentMethod === 'Naqd pul' ? cashReceived : grandTotal,
      cashChange: paymentMethod === 'Naqd pul' ? change : 0,
      subtotal,
      serviceAmount,
      grandTotal
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/70 backdrop-blur-sm animate-fade-in">
      <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-modal border border-stone-200 overflow-hidden">
        
        {/* Modal Header */}
        <div className="flex items-center justify-between pb-4 border-b border-stone-100">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center">
              <Icon name="cash" className="w-5 h-5" />
            </div>
            <div>
              <h3 className="text-lg font-extrabold text-stone-900">To‘lovni qabul qilish</h3>
              <p className="text-xs text-stone-500">{table.name} — {table.order?.length || 0} xil mahsulot</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 text-stone-400 hover:text-stone-700">
            <Icon name="close" className="w-5 h-5" />
          </button>
        </div>

        {/* Bill Total Banner */}
        <div className="my-5 p-4 rounded-2xl bg-cafe-50 border border-amber-200 text-center">
          <span className="text-xs font-bold text-stone-500 uppercase tracking-wider">Jami to‘lanishi kerak bo‘lgan summa</span>
          <div className="text-3xl font-extrabold text-cafe-900 font-mono mt-1 text-amber-700">
            {formatUZS(grandTotal)}
          </div>
        </div>

        {/* Payment Method Selector */}
        <div className="mb-5">
          <label className="block text-xs font-bold text-stone-600 mb-2 uppercase">To‘lov turini tanlang</label>
          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={() => setPaymentMethod('Naqd pul')}
              className={`p-3.5 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2.5 transition ${
                paymentMethod === 'Naqd pul'
                  ? 'border-amber-600 bg-amber-50/60 text-amber-900 shadow-sm'
                  : 'border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100'
              }`}
            >
              <Icon name="cash" className="w-5 h-5" />
              <span>Naqd pul</span>
            </button>
            <button
              onClick={() => setPaymentMethod('Plastik karta')}
              className={`p-3.5 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2.5 transition ${
                paymentMethod === 'Plastik karta'
                  ? 'border-amber-600 bg-amber-50/60 text-amber-900 shadow-sm'
                  : 'border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100'
              }`}
            >
              <Icon name="card" className="w-5 h-5" />
              <span>Plastik karta</span>
            </button>
          </div>
        </div>

        {/* Cash Calculator Section (If Cash Selected) */}
        {paymentMethod === 'Naqd pul' && (
          <div className="mb-5 p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
            <div>
              <label className="block text-xs font-semibold text-stone-600 mb-1">Mijoz bergan summa (so‘m):</label>
              <input
                type="number"
                value={cashReceived}
                onChange={(e) => setCashReceived(Number(e.target.value) || 0)}
                className="w-full px-3.5 py-2.5 bg-white border border-stone-300 rounded-xl text-lg font-mono font-bold text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
            </div>

            {/* Quick preset buttons */}
            <div className="flex flex-wrap gap-1.5">
              {presetAmounts.map((amt, i) => (
                <button
                  key={i}
                  onClick={() => setCashReceived(amt)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-mono font-semibold transition ${
                    cashReceived === amt ? 'bg-amber-600 text-white' : 'bg-white border border-stone-200 text-stone-700 hover:bg-stone-100'
                  }`}
                >

// 5. DAILY SALES AND STATISTICS VIEW
const StatisticsView = ({ orderHistory, tables, products }) => {
  const todayStr = new Date().toISOString().split('T')[0];
  const todayOrders = orderHistory.filter(o => o.dateOnly === todayStr || (o.timestamp && o.timestamp.startsWith(todayStr)));

  const todaySales = todayOrders.reduce((sum, o) => sum + (o.total || 0), 0);
  const totalProductsSold = todayOrders.reduce((sum, o) => {
    return sum + (o.items || []).reduce((s, i) => s + i.quantity, 0);
  }, 0);
  const completedOrdersCount = todayOrders.length;
  const occupiedTablesCount = tables.filter(t => t.status === 'occupied' || t.status === 'payment_pending').length;

  // Cash vs Card breakdown
  const cashSales = todayOrders.filter(o => o.paymentMethod === 'Naqd pul').reduce((s, o) => s + (o.total || 0), 0);
  const cardSales = todayOrders.filter(o => o.paymentMethod === 'Plastik karta').reduce((s, o) => s + (o.total || 0), 0);
  const cashPercent = todaySales > 0 ? Math.round((cashSales / todaySales) * 100) : 50;
  const cardPercent = todaySales > 0 ? 100 - cashPercent : 50;

  // Most popular products calculation
  const productStats = {};
  orderHistory.forEach(order => {
    (order.items || []).forEach(item => {
      if (!productStats[item.name]) {
        productStats[item.name] = { name: item.name, quantity: 0, revenue: 0, icon: item.icon };
      }
      productStats[item.name].quantity += item.quantity;
      productStats[item.name].revenue += item.price * item.quantity;
    });
  });

  const popularProducts = Object.values(productStats)
    .sort((a, b) => b.quantity - a.quantity)
    .slice(0, 5);

  const maxPopularQty = popularProducts.length > 0 ? popularProducts[0].quantity : 1;

  // Hourly sales distribution chart (Native HTML/SVG)
  const hours = ['09:00', '11:00', '13:00', '15:00', '17:00', '19:00', '21:00', '23:00'];
  const hourlyData = [
    { hour: '09:00', sales: 45000, orders: 1 },
    { hour: '11:00', sales: 86000, orders: 2 },
    { hour: '13:00', sales: 249000, orders: 4 },
    { hour: '15:00', sales: 120000, orders: 2 },
    { hour: '17:00', sales: todaySales > 500000 ? 180000 : 70000, orders: 2 },
    { hour: '19:00', sales: todaySales > 700000 ? 250000 : 90000, orders: 3 },
    { hour: '21:00', sales: todaySales > 900000 ? 160000 : 40000, orders: 1 },
    { hour: '23:00', sales: 0, orders: 0 }
  ];

  const maxHourlySales = Math.max(...hourlyData.map(d => d.sales), 100000);

  return (
    <div className="space-y-6">
      
      {/* Header */}
      <div>
        <h2 className="text-2xl font-extrabold text-stone-900">Kunlik savdo va statistika</h2>
        <p className="text-xs text-stone-500 mt-1">Har bir buyurtma to‘langanda statistika avtomatik yangilanadi</p>
      </div>

      {/* 4 Primary Stats */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard
          title="Bugungi umumiy tushum"
          value={formatUZS(todaySales)}
          subtext="Barcha to‘lovlar bo‘yicha"
          icon="cash"
          color="amber"
        />
        <StatCard
          title="Sotilgan mahsulotlar"
          value={`${totalProductsSold} ta`}
          subtext="Bugungi jami porsiyalar"
          icon="menu"
          color="cafe"
        />
        <StatCard
          title="Bajarilgan buyurtmalar"
          value={`${completedOrdersCount} ta`}
          subtext="Yopilgan hisoblar soni"
          icon="check"
          color="emerald"
        />
        <StatCard
          title="Hozirgi band stollar"
          value={`${occupiedTablesCount} ta`}
          subtext="10 ta stoldan faol"
          icon="user"
          color="indigo"
        />
      </div>

      {/* Charts Section: Hourly Bar Chart & Payment Method Distribution */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        {/* Hourly Sales Bar Chart (Native SVG & CSS) */}
        <div className="lg:col-span-2 bg-white rounded-3xl p-6 shadow-card border border-stone-200/80 flex flex-col justify-between">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h3 className="text-lg font-extrabold text-stone-900">Soatlik savdo dinamikasi</h3>
              <p className="text-xs text-stone-500">Kunning turli vaqtlaridagi kassa tushumi (so‘m)</p>
            </div>
            <span className="px-3 py-1 rounded-full bg-amber-50 text-amber-800 text-xs font-bold border border-amber-200">
              Bugungi kun
            </span>
          </div>

          {/* Bar Chart Container */}
          <div className="h-64 flex items-end justify-between gap-2 sm:gap-4 pt-8 pb-2 px-2 border-b border-stone-200">
            {hourlyData.map((d, idx) => {
              const heightPercent = Math.max(8, Math.round((d.sales / maxHourlySales) * 100));

              return (
                <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group relative">

                  <div className="absolute -top-12 bg-stone-900 text-white text-[10px] font-mono py-1 px-2 rounded-lg opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap shadow-lg z-20">

            <span>23:00 — Smena yakuni</span>
          </div>
        </div>

        {/* Payment Methods Breakdown */}
        <div className="bg-white rounded-3xl p-6 shadow-card border border-stone-200/80 flex flex-col justify-between">
          <div>
            <h3 className="text-lg font-extrabold text-stone-900">To‘lov turlari ulushi</h3>

          <div className="my-6 space-y-4">
            {/* Visual Bar */}
            <div className="h-6 w-full rounded-2xl bg-stone-100 p-1 flex overflow-hidden">

                style={{ width: `${cashPercent}%` }} 
                className="bg-emerald-500 rounded-l-xl transition-all duration-500"
                title={`Naqd pul: ${cashPercent}%`}

              <div 
                style={{ width: `${cardPercent}%` }}

  const [tables, setTables] = React.useState(() => {
    try {
      const saved = localStorage.getItem('RAYHON_CAFE_TABLES_V1');
      return saved ? JSON.parse(saved) : DEFAULT_TABLES;
    } catch (e) {
      return DEFAULT_TABLES;
    }
  });

  const [products, setProducts] = React.useState(() => {
    try {
      const saved = localStorage.getItem('RAYHON_CAFE_PRODUCTS_V1');
      return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
    } catch (e) {
      return DEFAULT_PRODUCTS;
    }
  });

  const [orderHistory, setOrderHistory] = React.useState(() => {
    try {
      const saved = localStorage.getItem('RAYHON_CAFE_HISTORY_V1');
      return saved ? JSON.parse(saved) : getInitialHistory();
    } catch (e) {
      return getInitialHistory();
    }
  });

  const [settings, setSettings] = React.useState(() => {
    try {
      const saved = localStorage.getItem('RAYHON_CAFE_SETTINGS_V1');
      return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
    } catch (e) {
      return DEFAULT_SETTINGS;
    }
  });

  // UI state
  const [activeTab, setActiveTab] = React.useState('dashboard'); // 'dashboard', 'tables', 'menu', 'history', 'stats', 'settings'
  const [selectedTableId, setSelectedTableId] = React.useState(null);
  const [paymentTable, setPaymentTable] = React.useState(null);
  const [receiptOrder, setReceiptOrder] = React.useState(null);
  const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
  const [soundEnabled, setSoundEnabled] = React.useState(true);
  const [currentTime, setCurrentTime] = React.useState(new Date());

  // Confirm Modal State
  const [confirmModal, setConfirmModal] = React.useState({
    isOpen: false,
    title: '',
    message: '',
    confirmText: 'Ha, tasdiqlayman',
    isDestructive: false,
    onConfirm: () => {}
  });

  // Toasts
  const [toasts, setToasts] = React.useState([]);

  const addToast = (type, title, message = '') => {
    const id = 't_' + Date.now() + Math.random().toString(36).substr(2, 4);
    setToasts(prev => [...prev, { id, type, title, message }]);
    if (soundEnabled) {
      if (type === 'success') playSound('add');
      else if (type === 'error') playSound('delete');
    }
    setTimeout(() => {
      setToasts(prev => prev.filter(t => t.id !== id));
    }, 3200);
  };

  const removeToast = (id) => {
    setToasts(prev => prev.filter(t => t.id !== id));
  };

  // Sync state to localStorage
  React.useEffect(() => {
    try {
      localStorage.setItem('RAYHON_CAFE_TABLES_V1', JSON.stringify(tables));
    } catch (e) {}
  }, [tables]);

  React.useEffect(() => {
    try {
      localStorage.setItem('RAYHON_CAFE_PRODUCTS_V1', JSON.stringify(products));
    } catch (e) {}
  }, [products]);

  React.useEffect(() => {
    try {
      localStorage.setItem('RAYHON_CAFE_HISTORY_V1', JSON.stringify(orderHistory));
    } catch (e) {}
  }, [orderHistory]);

  React.useEffect(() => {
    try {
      localStorage.setItem('RAYHON_CAFE_SETTINGS_V1', JSON.stringify(settings));
    } catch (e) {}
  }, [settings]);

  // Live Clock
  React.useEffect(() => {
    const timer = setInterval(() => setCurrentTime(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);

  // Handlers for Tables & Orders
  const handleSelectTable = (tableId) => {
    if (soundEnabled) playSound('click');
    setSelectedTableId(tableId);
  };

  const handleAddItem = (tableId, product) => {
    setTables(prev => prev.map(t => {
      if (t.id === tableId) {
        const currentOrder = t.order || [];
        const existingIndex = currentOrder.findIndex(item => item.id === product.id);
        let updatedOrder;

        if (existingIndex > -1) {
          updatedOrder = currentOrder.map((item, idx) => 
            idx === existingIndex ? { ...item, quantity: item.quantity + 1 } : item
          );
        } else {
          updatedOrder = [
            ...currentOrder,
            {
              id: product.id,
              name: product.name,
              price: product.price,
              category: product.category,
              icon: product.icon,
              quantity: 1
            }
          ];
        }

        // Auto change status to 'occupied' if it was 'available'
        const newStatus = t.status === 'available' ? 'occupied' : t.status;
        const openedAtTime = t.openedAt || formatTime(new Date());

        return {
          ...t,
          status: newStatus,
          order: updatedOrder,
          openedAt: openedAtTime
        };
      }
      return t;
    }));

    if (soundEnabled) playSound('add');
    addToast('success', `${product.name} qo‘shildi`, `Stol ${tableId} buyurtmasiga kiritildi`);
  };

  const handleUpdateQuantity = (tableId, itemId, newQuantity) => {
    setTables(prev => prev.map(t => {
      if (t.id === tableId) {
        let updatedOrder;
        if (newQuantity <= 0) {
          updatedOrder = (t.order || []).filter(item => item.id !== itemId);
        } else {
          updatedOrder = (t.order || []).map(item => 
            item.id === itemId ? { ...item, quantity: newQuantity } : item
          );
        }
        return { ...t, order: updatedOrder };
      }
      return t;
    }));

    if (soundEnabled) {
      if (newQuantity <= 0) playSound('delete');
      else playSound('click');
    }
  };

  const handleRemoveItem = (tableId, itemId) => {
    setTables(prev => prev.map(t => {
      if (t.id === tableId) {
        return {
          ...t,
          order: (t.order || []).filter(item => item.id !== itemId)
        };
      }
      return t;
    }));

    if (soundEnabled) playSound('delete');
    addToast('info', "Mahsulot o‘chirildi");
  };

  const handleChangeStatus = (tableId, newStatus) => {
    setTables(prev => prev.map(t => {
      if (t.id === tableId) {
        return { ...t, status: newStatus };
      }
      return t;
    }));
    if (soundEnabled) playSound('click');
    addToast('info', `Stol ${tableId} holati o‘zgardi`);
  };

  const handleClearTable = (tableId) => {
    const tableObj = tables.find(t => t.id === tableId);
    if (!tableObj) return;

    setConfirmModal({
      isOpen: true,
      title: `${tableObj.name}ni tozalash`,
      message: `Haqiqatan ham ${tableObj.name} buyurtmasini bekor qilib, stolni bo‘shatmoqchimisiz? Ushbu amal ortga qaytarilmaydi.`,
      confirmText: 'Ha, tozalash',
      isDestructive: true,
      onConfirm: () => {
        setTables(prev => prev.map(t => {
          if (t.id === tableId) {
            return {
              ...t,
              status: 'available',
              order: [],
              openedAt: null,
              notes: ''
            };
          }
          return t;
        }));
        setConfirmModal(prev => ({ ...prev, isOpen: false }));
        if (soundEnabled) playSound('delete');
        addToast('info', `${tableObj.name} tozalandi va bo‘shatildi`);
      }
    });
  };

  const handleTransferTable = (fromTableId, toTableId) => {
    const fromTable = tables.find(t => t.id === fromTableId);
    const toTable = tables.find(t => t.id === toTableId);
    if (!fromTable || !toTable) return;

    setTables(prev => prev.map(t => {
      if (t.id === toTableId) {
        return {
          ...t,
          status: 'occupied',
          order: [...(fromTable.order || [])],
          openedAt: fromTable.openedAt || formatTime(new Date()),
          notes: fromTable.notes || ''
        };
      }
      if (t.id === fromTableId) {
        return {
          ...t,
          status: 'available',
          order: [],
          openedAt: null,
          notes: ''
        };
      }
      return t;
    }));

    if (soundEnabled) playSound('add');
    addToast('success', "Stol ko‘chirildi", `${fromTable.name} buyurtmasi ${toTable.name}ga o‘tkazildi`);
  };

  const handleProceedToPayment = (table) => {
    setSelectedTableId(null);
    setPaymentTable(table);
  };

  const handleConfirmPayment = ({ table, paymentMethod, cashReceived, cashChange, subtotal, serviceAmount, grandTotal }) => {
    const now = new Date();
    const orderRecord = {
      id: "ORD-" + Math.floor(1000 + Math.random() * 9000),
      tableId: table.id,
      tableName: table.name,
      items: [...(table.order || [])],
      subtotal,
      serviceCharge: serviceAmount,
      total: grandTotal,
      paymentMethod,
      cashReceived,
      cashChange,
      timestamp: now.toISOString(),
      formattedDate: formatDateTime(now),
      dateOnly: now.toISOString().split('T')[0],
      waiter: table.waiter || "Alisher"
    };

    // Save to order history
    setOrderHistory(prev => [orderRecord, ...prev]);

    // Clear and mark table as available
    setTables(prev => prev.map(t => {
      if (t.id === table.id) {
        return {
          ...t,
          status: 'available',
          order: [],
          openedAt: null,
          notes: ''
        };
      }
      return t;
    }));

    setPaymentTable(null);
    if (soundEnabled) playSound('cash');
    addToast('success', "To‘lov muvaffaqiyatli qabul qilindi!", `${table.name} bo‘shatildi`);

    // Show thermal receipt modal
    setReceiptOrder(orderRecord);
  };

  // Menu Product Handlers
  const handleAddProduct = (newProduct) => {
    setProducts(prev => [...prev, newProduct]);
    addToast('success', "Yangi mahsulot menyuga qo‘shildi");
  };

  const handleUpdateProduct = (updatedProduct) => {
    setProducts(prev => prev.map(p => p.id === updatedProduct.id ? updatedProduct : p));
    addToast('success', "Mahsulot ma’lumotlari yangilandi");
  };

  const handleDeleteProduct = (productId) => {
    setConfirmModal({
      isOpen: true,
      title: "Mahsulotni o‘chirish",
      message: "Haqiqatan ham ushbu mahsulotni menyudan butunlay o‘chirmoqchimisiz?",
      confirmText: "Ha, o‘chirish",
      isDestructive: true,
      onConfirm: () => {
        setProducts(prev => prev.filter(p => p.id !== productId));
        setConfirmModal(prev => ({ ...prev, isOpen: false }));
        addToast('info', "Mahsulot menyudan o‘chirildi");
      }
    });
  };

  const handleUpdateSettings = (newSettings) => {
    setSettings(newSettings);
    addToast('success', "Sozlamalar muvaffaqiyatli saqlandi");
  };

  const handleResetAllData = () => {
    setConfirmModal({
      isOpen: true,
      title: "Boshlang‘ich ma’lumotlarni tiklash",
      message: "Barcha 10 ta stol va menyu dastlabki holatga qaytariladi. Rozimisiz?",
      confirmText: "Ha, qayta tiklash",
      isDestructive: true,
      onConfirm: () => {
        setTables(DEFAULT_TABLES);
        setProducts(DEFAULT_PRODUCTS);
        setOrderHistory(getInitialHistory());
        setSettings(DEFAULT_SETTINGS);
        setConfirmModal(prev => ({ ...prev, isOpen: false }));
        addToast('success', "Barcha ma’lumotlar tiklandi");
      }
    });
  };

  const handleClearHistory = () => {
    setConfirmModal({
      isOpen: true,
      title: "Tarixni tozalash",
      message: "Barcha yopilgan hisoblar va buyurtmalar tarixi o‘chiriladi. Davom etasizmi?",
      confirmText: "Ha, tozalash",
      isDestructive: true,
      onConfirm: () => {
        setOrderHistory([]);
        setConfirmModal(prev => ({ ...prev, isOpen: false }));
        addToast('info', "Buyurtmalar tarixi tozalandi");
      }
    });
  };

  const activeSelectedTable = tables.find(t => t.id === selectedTableId);
  const occupiedCount = tables.filter(t => t.status === 'occupied').length;
  const pendingCount = tables.filter(t => t.status === 'payment_pending').length;

  const navItems = [
    { id: 'dashboard', name: 'Bosh sahifa', icon: 'dashboard' },
    { id: 'tables', name: 'Stollar', icon: 'tables', badge: occupiedCount + pendingCount > 0 ? `${occupiedCount + pendingCount} band` : null },
    { id: 'menu', name: 'Menyu', icon: 'menu' },
    { id: 'history', name: 'Tarix', icon: 'history' },
    { id: 'stats', name: 'Statistika', icon: 'stats' },
    { id: 'settings', name: 'Sozlamalar', icon: 'settings' },
  ];

  return (
    <div className="flex h-screen overflow-hidden bg-[#FAF7F2]">
      
      {/* SIDEBAR (Desktop) */}
      <aside className="hidden lg:flex w-72 flex-col bg-cafe-950 text-white border-r border-cafe-900 select-none">
        
        {/* Brand Header */}
        <div className="p-6 border-b border-cafe-900/80 flex items-center gap-3.5">
          <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-400 text-cafe-950 flex items-center justify-center font-black shadow-lg shadow-amber-500/20">
            <Icon name="coffee-cup" className="w-7 h-7" />
          </div>
          <div>
            <h1 className="font-extrabold text-base tracking-wide text-white">{settings.cafeName}</h1>
            <p className="text-[11px] text-amber-300/80 font-medium">Boshqaruv tizimi (POS)</p>
          </div>
        </div>

        {/* Live Clock Card */}
        <div className="px-6 py-4 border-b border-cafe-900/50 bg-cafe-900/30">
          <div className="flex items-center justify-between text-xs text-stone-400">
            <span className="flex items-center gap-1.5 font-medium">
              <Icon name="clock" className="w-3.5 h-3.5 text-amber-400" />
              <span>{formatDate(currentTime)}</span>
            </span>
            <span className="font-mono font-bold text-amber-300 text-sm">
              {formatTime(currentTime)}
            </span>
          </div>
        </div>

        {/* Navigation Items */}
        <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
          {navItems.map(item => {
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                onClick={() => {
                  if (soundEnabled) playSound('click');
                  setActiveTab(item.id);
                }}
                className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-xs font-bold transition-all duration-200 ${
                  isActive
                    ? 'bg-amber-500 text-cafe-950 shadow-lg shadow-amber-500/20 translate-x-1'
                    : 'text-stone-300 hover:text-white hover:bg-cafe-900/60'
                }`}
              >
                <div className="flex items-center gap-3">
                  <Icon name={item.icon} className={`w-5 h-5 ${isActive ? 'text-cafe-950' : 'text-stone-400'}`} />
                  <span className="text-sm">{item.name}</span>
                </div>
                {item.badge && (
                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                    isActive ? 'bg-cafe-950 text-amber-300' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                  }`}>
                    {item.badge}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {/* Sound toggle & Waiter Profile Footer */}
        <div className="p-4 border-t border-cafe-900/80 bg-cafe-900/40 space-y-3">
          <div className="flex items-center justify-between text-xs text-stone-400 px-2">
            <span>Ovozli signallar</span>
            <button
              onClick={() => setSoundEnabled(!soundEnabled)}
              className={`p-1.5 rounded-xl border transition ${
                soundEnabled ? 'bg-amber-500/20 border-amber-500/40 text-amber-300' : 'bg-stone-800 border-stone-700 text-stone-500'
              }`}
              title={soundEnabled ? "Ovozni o'chirish" : "Ovozni yoqish"}
            >
              <Icon name="check" className={`w-3.5 h-3.5 ${soundEnabled ? 'opacity-100' : 'opacity-0'}`} />
            </button>
          </div>

          <div className="flex items-center gap-3 p-2 rounded-2xl bg-cafe-900/60 border border-cafe-800">
            <div className="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center font-bold text-xs">
              <Icon name="user" className="w-4 h-4" />
            </div>
            <div className="min-w-0 flex-1">
              <h5 className="font-bold text-xs text-white truncate">Alisher (Kassir)</h5>
              <p className="text-[10px] text-emerald-400 flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                Tizimda onlayn
              </p>
            </div>
          </div>
        </div>

      </aside>

      {/* MOBILE SIDEBAR DRAWER */}
      {mobileMenuOpen && (
        <div className="fixed inset-0 z-50 lg:hidden flex">
          <div className="fixed inset-0 bg-stone-950/60 backdrop-blur-sm" onClick={() => setMobileMenuOpen(false)}></div>
          <div className="relative w-72 bg-cafe-950 text-white flex flex-col h-full shadow-2xl z-10">
            <div className="p-6 border-b border-cafe-900 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-amber-500 text-cafe-950 flex items-center justify-center font-black">
                  <Icon name="coffee-cup" className="w-5 h-5" />
                </div>
                <h3 className="font-bold text-sm text-white">{settings.cafeName}</h3>
              </div>
              <button onClick={() => setMobileMenuOpen(false)} className="text-stone-400 hover:text-white">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveTab(item.id);
                    setMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-xs font-bold transition ${
                    activeTab === item.id ? 'bg-amber-500 text-cafe-950 font-extrabold' : 'text-stone-300 hover:bg-cafe-900'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <Icon name={item.icon} className="w-5 h-5" />
                    <span>{item.name}</span>
                  </div>
                  {item.badge && (
                    <span className="px-2 py-0.5 rounded-full text-[10px] bg-amber-500/20 text-amber-300">
                      {item.badge}
                    </span>
                  )}
                </button>
              ))}
            </nav>
          </div>
        </div>
      )}

      {/* MAIN CONTENT AREA */}
      <div className="flex-1 flex flex-col h-full overflow-hidden">
        
        {/* Top Header Bar */}
        <header className="h-18 px-4 sm:px-8 py-3.5 bg-white border-b border-stone-200/80 flex items-center justify-between shrink-0">
          <div className="flex items-center gap-3">
            <button
              onClick={() => setMobileMenuOpen(true)}
              className="lg:hidden p-2 rounded-xl text-stone-600 hover:bg-stone-100"
            >
              <Icon name="menu" className="w-6 h-6" />
            </button>
            <div>
              <h2 className="text-lg font-extrabold text-stone-900 capitalize">
                {navItems.find(i => i.id === activeTab)?.name || 'Boshqaruv'}
              </h2>
              <p className="text-[11px] text-stone-400 hidden sm:block">
                Toshkent vaqti: {formatTime(currentTime)} | 10 ta stol monitoringi
              </p>
            </div>
          </div>

          <div className="flex items-center gap-2 sm:gap-3">
            {/* Quick Active Tables Pill */}
            <div 
              onClick={() => setActiveTab('tables')}
              className="cursor-pointer px-3.5 py-1.5 rounded-2xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900 text-xs font-bold flex items-center gap-2 transition"
            >
              <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse-dot"></span>
              <span>Band stollar: <b>{occupiedCount + pendingCount}/10</b></span>
            </div>

            {/* Quick POS opener */}
            <button
              onClick={() => {
                const firstAvailable = tables.find(t => t.status === 'available') || tables[0];
                handleSelectTable(firstAvailable.id);
              }}
              className="px-4 py-2 rounded-2xl bg-cafe-800 hover:bg-cafe-900 text-amber-300 font-bold text-xs shadow-md shadow-cafe-900/10 flex items-center gap-1.5 transition"
            >
              <Icon name="plus" className="w-4 h-4" />
              <span className="hidden sm:inline">Tezkor buyurtma</span>
            </button>
          </div>
        </header>

        {/* Main Tab Screen Container */}
        <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
          <div className="max-w-7xl mx-auto">
            {activeTab === 'dashboard' && (
              <DashboardView
                tables={tables}
                products={products}
                orderHistory={orderHistory}
                onSelectTable={handleSelectTable}
                onOpenReceipt={(order) => setReceiptOrder(order)}
                onNavigateTab={(tab) => setActiveTab(tab)}
              />
            )}

            {activeTab === 'tables' && (
              <TablesView
                tables={tables}
                onSelectTable={handleSelectTable}
                onChangeStatus={handleChangeStatus}
                onProceedToPayment={handleProceedToPayment}
                onClearTable={handleClearTable}
              />
            )}

            {activeTab === 'menu' && (
              <MenuView
                products={products}
                tables={tables}
                onSelectProduct={(product) => {
                  // If a table is active, add to it; else prompt to open table
                  const firstOccupiedOrAvail = tables.find(t => t.status === 'occupied') || tables.find(t => t.status === 'available') || tables[0];
                  handleSelectTable(firstOccupiedOrAvail.id);
                  handleAddItem(firstOccupiedOrAvail.id, product);
                }}
              />
            )}

            {activeTab === 'history' && (
              <HistoryView
                orderHistory={orderHistory}
                onOpenReceipt={(order) => setReceiptOrder(order)}
              />
            )}

            {activeTab === 'stats' && (
              <StatisticsView
                orderHistory={orderHistory}
                tables={tables}
                products={products}
              />
            )}

            {activeTab === 'settings' && (
              <SettingsView
                settings={settings}
                onUpdateSettings={handleUpdateSettings}
                products={products}
                onAddProduct={handleAddProduct}
                onUpdateProduct={handleUpdateProduct}
                onDeleteProduct={handleDeleteProduct}
                onResetAllData={handleResetAllData}
                onClearHistory={handleClearHistory}
              />
            )}
          </div>
        </main>

      </div>

      {/* POS Order Modal Drawer */}
      <POSDrawer
        isOpen={Boolean(selectedTableId)}
        table={activeSelectedTable}
        products={products}
        onClose={() => setSelectedTableId(null)}
        onAddItem={handleAddItem}
        onUpdateQuantity={handleUpdateQuantity}
        onRemoveItem={handleRemoveItem}
        onProceedToPayment={handleProceedToPayment}
        onChangeStatus={handleChangeStatus}
        onClearTable={handleClearTable}
        onTransferTable={handleTransferTable}
        tablesList={tables}
        serviceFeePercent={settings.serviceFeePercent || 0}
      />

      {/* Payment Checkout Modal */}
      <PaymentModal
        isOpen={Boolean(paymentTable)}
        table={paymentTable}
        settings={settings}
        onClose={() => setPaymentTable(null)}
        onConfirmPayment={handleConfirmPayment}
      />

      {/* Thermal Receipt Print Modal */}
      <ReceiptModal
        isOpen={Boolean(receiptOrder)}
        order={receiptOrder}
        settings={settings}
        onClose={() => setReceiptOrder(null)}
      />

      {/* Confirmation Dialog */}
      <ConfirmModal
        isOpen={confirmModal.isOpen}
        title={confirmModal.title}
        message={confirmModal.message}
        confirmText={confirmModal.confirmText}
        isDestructive={confirmModal.isDestructive}
        onConfirm={confirmModal.onConfirm}
        onCancel={() => setConfirmModal(prev => ({ ...prev, isOpen: false }))}
      />

      {/* Floating Toast Alerts */}
      <ToastContainer
        toasts={toasts}
        onDismiss={removeToast}
      />

    </div>
  );
};

// Render React App to DOM
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);


  </script>
</body>
</html>
